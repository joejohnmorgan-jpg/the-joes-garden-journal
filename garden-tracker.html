<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joe's Garden Journal</title>
    
    <!-- Mobile Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Font Awesome 6 Icons Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --dirt-dark: #5d4037;
            --dirt-light: #8d6e63;
            --bg-canvas: #f5f5f5;
            --text-main: #333;
            --status-growing: #ffb300;
            --status-ready: #d84315;
            --accent-blue: #1e88e5;
            
            /* Icon Color Palette */
            --veg-red: #ff3b30;
            --veg-green: #4cd964;
            --veg-orange: #ff9500;
            --veg-purple: #af52de;
            --veg-muted: #bcbbc1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 500px;
        }

        header h1 {
            color: var(--primary);
            font-size: 24px;
            margin-bottom: 4px;
        }

        header p {
            font-size: 14px;
            color: #666;
        }

        .controls-card, .ledger-card, .journal-section {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .input-group.year-group {
            flex: 1.3;
        }

        .input-group label {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 4px;
        }

        .input-group input, .input-group select, .input-group textarea {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px; /* Prevents iOS zoom */
            background: white;
            color: var(--text-main);
        }

        .input-group input, .input-group select {
            text-align: center;
            font-weight: 500;
        }

        .input-group select {
            text-align-last: center;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: var(--primary);
            outline: none;
        }

        .summary-text {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--dirt-dark);
            background: #efebe9;
            padding: 8px;
            border-radius: 6px;
        }

        .reset-grid-btn {
            width: 100%;
            background: #fff5f5;
            border: 1px dashed #e53935;
            color: #c62828;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .reset-grid-btn:active {
            background: #ffebee;
        }

        /* Garden Canvas Grid */
        .grid-wrapper {
            width: 100%;
            max-width: 500px;
            overflow-x: auto;
            padding-bottom: 15px;
        }

        .garden-grid {
            display: grid;
            gap: 6px;
            margin: 0 auto;
            background: #d7ccc8;
            padding: 8px;
            border-radius: 8px;
        }

        .grid-square {
            background-color: var(--dirt-dark);
            border: 2px solid #4e342e;
            border-radius: 6px;
            aspect-ratio: 1 / 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background-color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .grid-square:active {
            transform: scale(0.95);
        }

        .grid-square.growing {
            border-color: var(--status-growing);
            box-shadow: inset 0 0 0 2px var(--status-growing);
        }

        .grid-square.ready {
            border-color: var(--status-ready);
            box-shadow: inset 0 0 0 3px var(--status-ready);
            background-color: #3e2723;
        }

        /* Vegetable Icons layout */
        .grid-veg-icon {
            font-size: 22px;
            z-index: 5;
            filter: drop-shadow(0px 1px 3px rgba(0,0,0,0.8));
            pointer-events: none;
            margin-top: -12px;
        }

        /* Icon Colors */
        .c-red { color: var(--veg-red); }
        .c-green { color: var(--veg-green); }
        .c-orange { color: var(--veg-orange); }
        .c-purple { color: var(--veg-purple); }
        .c-muted { color: var(--veg-muted); }

        .plant-overlay-layout {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: grid;
            padding: 10%;
            gap: 8%;
            opacity: 0.22;
        }

        .dot-sprout {
            background-color: #76ff03;
            border-radius: 50%;
            box-shadow: 0 0 3px rgba(0,0,0,0.5);
            aspect-ratio: 1 / 1;
        }
        
        .ready .dot-sprout {
            background-color: #ffeb3b;
            box-shadow: 0 0 5px #ffeb3b;
        }

        /* Twin Date Badges (Up & Down Live Tracking) */
        .growth-day-badge {
            position: absolute;
            bottom: 3px;
            left: 4px;
            font-size: 8px;
            color: rgba(255,255,255,0.85);
            font-weight: 500;
            z-index: 6;
        }

        .time-badge {
            position: absolute;
            top: 3px;
            right: 4px;
            font-size: 8px;
            padding: 1px 4px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            z-index: 6;
        }
        
        .grid-square.ready .time-badge {
            background: var(--status-ready);
        }

        /* Cost Ledger Elements */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 6px;
        }

        .card-header h2 {
            font-size: 17px;
            color: var(--dirt-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cost-tracker-banner {
            background: #e3f2fd;
            border-left: 4px solid var(--accent-blue);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            color: #0d47a1;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 70px;
            font-size: 14px;
            line-height: 1.4;
        }

        /* Growth Photo Journal */
        .add-photo-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        #hiddenFilePicker {
            display: none;
        }

        .photo-gallery {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .photo-card {
            display: flex;
            background: #fafafa;
            border: 1px solid #eef0ee;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .photo-thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            background: #eee;
        }

        .photo-details {
            padding: 8px 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .photo-date {
            font-size: 11px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 2px;
        }

        .photo-caption {
            font-size: 13px;
            color: #555;
            line-height: 1.3;
        }

        .delete-photo-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(255, 235, 235, 0.9);
            border: 1px solid #ffcdd2;
            color: #c62828;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Pop Up Card Bottom-Sheet Modal Layout */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: flex-end; /* Locks drawer flush against touch layout bottom edge */
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease-out;
            z-index: 100;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            transform: translateY(100%); /* Keeps sheet completely hidden off-canvas bottom */
            transition: transform 0.24s cubic-bezier(0.1, 0.7, 0.3, 1);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
        }

        .modal.open .modal-content {
            transform: translateY(0); /* Transitions up directly under thumb range */
        }

        /* Visual grab line representing bottom-sheet handles */
        .modal-drag-handle {
            width: 44px;
            height: 5px;
            background-color: #dcdcdc;
            border-radius: 3px;
            margin: -6px auto 14px auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        .close-btn {
            background: #f0f0f0;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            color: #555;
        }

        .config-panel {
            background: #f1f8e9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .config-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .config-row input, .config-row select {
            width: 140px;
            padding: 6px;
            border-radius: 4px;
            border: 2px solid var(--primary);
            text-align: center;
            font-size: 14px;
        }

        .veggie-list {
            overflow-y: auto;
            flex: 1;
        }

        .veggie-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            background: #fafafa;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .veggie-item.clear-option {
            background: #ffebee;
            border-color: #ffcdd2;
            color: #c62828;
            font-weight: bold;
        }

        .veggie-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .veggie-list-icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }

        .veggie-meta {
            font-size: 11px;
            color: #777;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Joe's Garden Journal</h1>
        <p>Intensive Garden Tracker & History Log</p>
    </header>

    <!-- Bed Setup Card -->
    <div class="controls-card">
        <div class="input-row">
            <div class="input-group year-group">
                <label for="gardenYear">Season Year</label>
                <select id="gardenYear"></select>
            </div>
            <div class="input-group">
                <label for="bedWidth">Width (Ft)</label>
                <input type="number" id="bedWidth" value="4" min="1" max="12">
            </div>
            <div class="input-group">
                <label for="bedLength">Length (Ft)</label>
                <input type="number" id="bedLength" value="4" min="1" max="12">
            </div>
        </div>
        <div class="summary-text" id="summaryBox">Your Bed Size: 4' x 4' (16 Sq Ft)</div>
        <button class="reset-grid-btn" onclick="confirmAndResetGrid()">
            <i class="fa-solid fa-trash-can"></i> Clear 2026 Grid
        </button>
    </div>

    <!-- Interactive Grid Layout Canvas -->
    <div class="grid-wrapper">
        <div class="garden-grid" id="gardenGrid"></div>
    </div>

    <!-- Material Ledger & Treatment Log Card -->
    <div class="ledger-card">
        <div class="card-header">
            <h2>📊 Seasonal Treatment & Cost Ledger</h2>
        </div>
        
        <div class="cost-tracker-banner">
            <span>Total Season Investment:</span>
            <span id="totalCostSpan">$0.00</span>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label for="topsoilQty">Topsoil Amount Used</label>
                <input type="text" id="topsoilQty" placeholder="e.g., 4 Bags, 1/2 Yard">
            </div>
            <div class="input-group">
                <label for="topsoilCost">Topsoil Cost ($)</label>
                <input type="number" id="topsoilCost" step="0.01" placeholder="0.00">
            </div>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label for="topdressDate">Date Top Dressed</label>
                <input type="date" id="topdressDate">
            </div>
            <div class="input-group">
                <label for="fertCost">Fertilizer Cost ($)</label>
                <input type="number" id="fertCost" step="0.01" placeholder="0.00">
            </div>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label for="seedCost">Seed Packets Cost ($)</label>
                <input type="number" id="seedCost" step="0.01" placeholder="0.00">
            </div>
            <div class="input-group">
                <label for="seedlingCost">Nursery Seedlings ($)</label>
                <input type="number" id="seedlingCost" step="0.01" placeholder="0.00">
            </div>
        </div>

        <div class="input-row" style="margin-bottom: 0;">
            <div class="input-group">
                <label for="fertType">Type of Fertilization Applied</label>
                <textarea id="fertType" placeholder="e.g., Granular 4-4-4 organic, liquid kelp, compost tea blends..."></textarea>
            </div>
        </div>
    </div>

    <!-- Photo Journal Segment -->
    <div class="journal-section">
        <div class="card-header">
            <h2>📷 Growth Photo Journal</h2>
            <button class="add-photo-btn" onclick="triggerPhotoUpload()">＋ Log Photo</button>
            <input type="file" id="hiddenFilePicker" accept="image/*" onchange="handleIncomingPhoto(event)">
        </div>
        <div class="photo-gallery" id="photoGalleryContainer"></div>
    </div>

    <!-- Configuration Modal (Bottom Sheet Style Popup) -->
    <div class="modal" id="plantModal">
        <div class="modal-content">
            <div class="modal-drag-handle"></div>
            <div class="modal-header">
                <h3 id="modalTitle">Set Up Square</h3>
                <button class="close-btn" onclick="closeModal()">Close</button>
            </div>
            
            <div class="config-panel">
                <div class="config-row">
                    <label style="font-weight:bold;">Plants inside square:</label>
                    <input type="number" id="customQty" min="1" max="16" value="1">
                </div>
                <div class="config-row">
                    <label style="font-weight:bold;">Planting Method:</label>
                    <select id="plantingMethod">
                        <option value="seedling">Nursery Seedling</option>
                        <option value="seed">Direct Seed</option>
                    </select>
                </div>
                <div class="config-row">
                    <label style="font-weight:bold;">Date Planted:</label>
                    <input type="date" id="plantingDate">
                </div>
            </div>

            <div class="veggie-list" id="veggieListOptions"></div>
        </div>
    </div>

    <script>
        const veggieDatabase = [
            { id: 1, name: "Hot Peppers", icon: "fa-solid fa-pepper-hot", color: "c-red", qty: 1, seedDtm: 120, seedlingDtm: 90, info: "Ghost, Jalapeño, Habanero" },
            { id: 2, name: "Cucumbers", icon: "fa-solid fa-seedling", color: "c-green", qty: 1, seedDtm: 65, seedlingDtm: 55, info: "Needs trellis support" },

            { id: 5, name: "Spinach", icon: "fa-solid fa-leaf", color: "c-green", qty: 9, seedDtm: 45, seedlingDtm: 25, info: "Bloomsdale leafy green" },

            { id: 18, name: "Swiss Chard", icon: "fa-solid fa-leaf", color: "c-purple", qty: 4, seedDtm: 60, seedlingDtm: 40, info: "Bright colorful multi-harvest stems" },
            { id: 19, name: "Broccoli", icon: "fa-solid fa-tree", color: "c-green", qty: 1, seedDtm: 100, seedlingDtm: 70, info: "Requires complete square foot" },
            { id: 20, name: "Cabbage", icon: "fa-solid fa-circle", color: "c-green", qty: 1, seedDtm: 110, seedlingDtm: 80, info: "Heavy heading crop variety" },
            { id: 21, name: "Peas (Snap)", icon: "fa-solid fa-toggle-on", color: "c-green", qty: 8, seedDtm: 65, seedlingDtm: 50, info: "Climbing early spring treat" },
            { id: 22, name: "Zucchini (Yellow)", icon: "fa-solid fa-lemon", color: "c-orange", qty: 1, seedDtm: 55, seedlingDtm: 45, info: "High-yield summer squash" },
            { id: 23, name: "Eggplant", icon: "fa-solid fa-seedling", color: "c-purple", qty: 1, seedDtm: 110, seedlingDtm: 75, info: "Heat loving nightshade crop" },
            { id: 24, name: "Bush Squash", icon: "fa-solid fa-lemon", color: "c-orange", qty: 1, seedDtm: 85, seedlingDtm: 75, info: "Acorn / compact winter options" },
            { id: 25, name: "Basil", icon: "fa-solid fa-leaf", color: "c-green", qty: 4, seedDtm: 60, seedlingDtm: 35, info: "Aromatic companion herb layer" }
        ];

        let activeSquareId = null;
        let masterGardenDatabase = {};
        let photoJournalDatabase = {}; 
        let notesLedgerDatabase = {}; 
        let currentSelectedYear = "2026";

        const yearSelect = document.getElementById('gardenYear');
        const widthInput = document.getElementById('bedWidth');
        const lengthInput = document.getElementById('bedLength');
        const gridContainer = document.getElementById('gardenGrid');
        const summaryBox = document.getElementById('summaryBox');
        const modal = document.getElementById('plantModal');
        const customQtyInput = document.getElementById('customQty');
        const methodInput = document.getElementById('plantingMethod');
        const dateInput = document.getElementById('plantingDate');
        const galleryContainer = document.getElementById('photoGalleryContainer');

        const topsoilQtyInput = document.getElementById('topsoilQty');
        const topsoilCostInput = document.getElementById('topsoilCost');
        const topdressDateInput = document.getElementById('topdressDate');
        const fertCostInput = document.getElementById('fertCost');
        const seedCostInput = document.getElementById('seedCost');
        const seedlingCostInput = document.getElementById('seedlingCost');
        const fertTypeInput = document.getElementById('fertType');
        const totalCostSpan = document.getElementById('totalCostSpan');

        function initApp() {
            setupYearDropdown();

            const savedMasterData = localStorage.getItem('plotAndPlantMasterDb');
            const savedPhotos = localStorage.getItem('plotAndPlantPhotoDb');
            const savedLedger = localStorage.getItem('plotAndPlantLedgerDb');
            const savedWidth = localStorage.getItem('plotAndPlantWidth');
            const savedLength = localStorage.getItem('plotAndPlantLength');
            const savedYear = localStorage.getItem('plotAndPlantActiveYear');

            if (savedMasterData) masterGardenDatabase = JSON.parse(savedMasterData);
            if (savedPhotos) photoJournalDatabase = JSON.parse(savedPhotos);
            if (savedLedger) notesLedgerDatabase = JSON.parse(savedLedger);
            if (savedWidth) widthInput.value = savedWidth;
            if (savedLength) lengthInput.value = savedLength;
            
            if (savedYear && parseInt(savedYear) >= 2026) {
                currentSelectedYear = savedYear;
                yearSelect.value = savedYear;
            } else {
                currentSelectedYear = "2026";
                yearSelect.value = "2026";
            }

            ensureYearExistsInDb(currentSelectedYear);
            setSmartDateFallbacks();
            renderGrid();
            renderPhotos();
            loadYearLedgerData();
            
            // Set initial reset button label safely
            document.querySelector('.reset-grid-btn').innerHTML = `<i class="fa-solid fa-trash-can"></i> Clear ${currentSelectedYear} Grid`;
            
            widthInput.addEventListener('input', () => { saveDimensions(); renderGrid(); });
            lengthInput.addEventListener('input', () => { saveDimensions(); renderGrid(); });
            yearSelect.addEventListener('change', handleYearChange);

            const ledgerFields = [topsoilQtyInput, topsoilCostInput, topdressDateInput, fertCostInput, fertTypeInput, seedCostInput, seedlingCostInput];
            ledgerFields.forEach(field => field.addEventListener('input', saveYearLedgerData));
        }

        function setupYearDropdown() {
            const startYear = 2026;
            const endYear = 2040;
            yearSelect.innerHTML = '';
            for (let yr = startYear; yr <= endYear; yr++) {
                const opt = document.createElement('option');
                opt.value = yr.toString();
                opt.innerText = `Season ${yr}`;
                if (yr === 2026) opt.selected = true;
                yearSelect.appendChild(opt);
            }
            currentSelectedYear = yearSelect.value;
        }

        function ensureYearExistsInDb(year) {
            if (!masterGardenDatabase[year]) masterGardenDatabase[year] = {};
            if (!photoJournalDatabase[year]) photoJournalDatabase[year] = [];
            if (!notesLedgerDatabase[year]) {
                notesLedgerDatabase[year] = { topsoilQty: '', topsoilCost: '', topdressDate: '', fertCost: '', fertType: '', seedCost: '', seedlingCost: '' };
            }
        }

        function setSmartDateFallbacks() {
            const today = new Date();
            const fallbackStr = (currentSelectedYear === today.getFullYear().toString()) 
                ? today.toISOString().split('T')[0] 
                : `${currentSelectedYear}-05-01`;
            
            dateInput.value = fallbackStr;
            if (!topdressDateInput.value) topdressDateInput.value = fallbackStr;
        }

        function handleYearChange() {
            currentSelectedYear = yearSelect.value;
            localStorage.setItem('plotAndPlantActiveYear', currentSelectedYear);
            ensureYearExistsInDb(currentSelectedYear);
            setSmartDateFallbacks();
            renderGrid();
            renderPhotos();
            loadYearLedgerData();
            
            // Dynamic text update for the reset button
            document.querySelector('.reset-grid-btn').innerHTML = `<i class="fa-solid fa-trash-can"></i> Clear ${currentSelectedYear} Grid`;
        }

        function saveDimensions() {
            localStorage.setItem('plotAndPlantWidth', widthInput.value);
            localStorage.setItem('plotAndPlantLength', lengthInput.value);
        }

        function renderGrid() {
            const w = Math.max(1, parseInt(widthInput.value) || 4);
            const l = Math.max(1, parseInt(lengthInput.value) || 4);
            const totalSquares = w * l;

            summaryBox.innerText = `[${currentSelectedYear} Layout] Bed Size: ${w}' x ${l}' (${totalSquares} Sq Ft)`;
            gridContainer.innerHTML = '';
            gridContainer.style.gridTemplateColumns = `repeat(${w}, 1fr)`;

            const currentYearLayout = masterGardenDatabase[currentSelectedYear];

            for (let r = 1; r <= l; r++) {
                for (let c = 1; c <= w; c++) {
                    const coordKey = `${c}_${r}`;
                    const square = document.createElement('div');
                    square.className = 'grid-square';
                    square.id = `sq_${coordKey}`;
                    
                    if (currentYearLayout && currentYearLayout[coordKey]) {
                        processLifecycleState(square, currentYearLayout[coordKey]);
                    }

                    square.onclick = () => openPlantMenu(coordKey);
                    gridContainer.appendChild(square);
                }
            }
        }

        function processLifecycleState(squareElement, data) {
            const planted = new Date(data.datePlanted);
            const today = new Date();
            
            today.setHours(0,0,0,0);
            planted.setHours(0,0,0,0);
            
            const timeDiff = today.getTime() - planted.getTime();
            const daysPassed = Math.floor(timeDiff / (1000 * 3600 * 24));
            
            const targetDtm = (data.method === 'seed') ? data.seedDtm : data.seedlingDtm;
            const daysRemaining = targetDtm - daysPassed;

            if (daysRemaining <= 0) {
                squareElement.classList.add('ready');
            } else {
                squareElement.classList.add('growing');
            }

            const layoutOverlay = document.createElement('div');
            layoutOverlay.className = 'plant-overlay-layout';
            
            let cols = 1;
            if (data.qty > 9) cols = 4;
            else if (data.qty > 4) cols = 3;
            else if (data.qty > 1) cols = 2;
            layoutOverlay.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            for (let i = 0; i < data.qty; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot-sprout';
                layoutOverlay.appendChild(dot);
            }

            const vegIcon = document.createElement('i');
            const activeIconClass = data.icon || "fa-solid fa-seedling";
            const activeColorClass = data.color || "c-green";
            vegIcon.className = `${activeIconClass} ${activeColorClass} grid-veg-icon`;

            const growthBadge = document.createElement('div');
            growthBadge.className = 'growth-day-badge';
            growthBadge.innerText = `d:${daysPassed >= 0 ? daysPassed : 0}`;

            const countdownBadge = document.createElement('div');
            countdownBadge.className = 'time-badge';
            
            const choiceYearNum = parseInt(currentSelectedYear);
            const realCurrentYearNum = today.getFullYear();
            
            if (choiceYearNum < realCurrentYearNum) {
                countdownBadge.innerText = "PAST";
                squareElement.classList.remove('growing');
                squareElement.classList.add('ready');
            } else {
                countdownBadge.innerText = daysRemaining <= 0 ? "READY" : `${daysRemaining}d`;
            }

            squareElement.appendChild(layoutOverlay);
            squareElement.appendChild(vegIcon);
            squareElement.appendChild(growthBadge);
            squareElement.appendChild(countdownBadge);
        }

        function openPlantMenu(coordKey) {
            activeSquareId = coordKey;
            const currentYearLayout = masterGardenDatabase[currentSelectedYear];
            const existingData = currentYearLayout ? currentYearLayout[coordKey] : null;
            
            if (existingData) {
                document.getElementById('modalTitle').innerText = `Edit Sq ${coordKey.replace('_',',')} (${currentSelectedYear})`;
                customQtyInput.value = existingData.qty;
                methodInput.value = existingData.method;
                dateInput.value = existingData.datePlanted;
            } else {
                document.getElementById('modalTitle').innerText = `Plant Sq ${coordKey.replace('_',',')} (${currentSelectedYear})`;
                customQtyInput.value = 1;
                methodInput.value = "seedling";
                setSmartDateFallbacks();
            }

            buildVeggieSelectionList(existingData);
            modal.classList.add('open');
        }

        function buildVeggieSelectionList(existingData = null) {
            const listContainer = document.getElementById('veggieListOptions');
            listContainer.innerHTML = '';

            const clearBtn = document.createElement('div');
            clearBtn.className = 'veggie-item clear-option';
            clearBtn.innerHTML = `<div>Clear Square</div><div class="veggie-meta">Empty this square</div>`;
            clearBtn.onclick = () => assignCropToSquare(null);
            listContainer.appendChild(clearBtn);

            veggieDatabase.forEach(veg => {
                const item = document.createElement('div');
                item.className = 'veggie-item';
                
                const isCurrentMatch = existingData && existingData.name === veg.name;
                
                if (isCurrentMatch) {
                    item.style.backgroundColor = '#e8f5e9';
                    item.style.borderColor = 'var(--primary-light)';
                    item.style.borderWidth = '2px';
                }

                item.innerHTML = `
                    <div class="veggie-item-left">
                        <i class="${veg.icon} ${veg.color} veggie-list-icon"></i>
                        <div>
                            <strong>${veg.name} ${isCurrentMatch ? ' <span style="color: var(--primary); font-size: 11px; font-weight:bold;">(Selected)</span>' : ''}</strong>
                            <div class="veggie-meta">${veg.info}</div>
                        </div>
                    </div>
                    <div style="background: var(--primary); color: white; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold;">
                        ${veg.qty}/sq
                    </div>
                `;
                item.onclick = () => assignCropToSquare(veg);
                listContainer.appendChild(item);
            });
        }

        function closeModal() {
            modal.classList.remove('open');
            activeSquareId = null;
        }

        function assignCropToSquare(veggieObj) {
            if (!activeSquareId) return;
            ensureYearExistsInDb(currentSelectedYear);

            if (!veggieObj) {
                delete masterGardenDatabase[currentSelectedYear][activeSquareId];
            } else {
                masterGardenDatabase[currentSelectedYear][activeSquareId] = {
                    name: veggieObj.name,
                    icon: veggieObj.icon,
                    color: veggieObj.color,
                    qty: parseInt(customQtyInput.value) || veggieObj.qty,
                    method: methodInput.value,
                    datePlanted: dateInput.value,
                    seedDtm: veggieObj.seedDtm,
                    seedlingDtm: veggieObj.seedlingDtm
                };
            }

            localStorage.setItem('plotAndPlantMasterDb', JSON.stringify(masterGardenDatabase));
            renderGrid();
            closeModal();
        }

        function confirmAndResetGrid() {
            const isSure = window.confirm(`Are you absolutely sure you want to completely clear your ${currentSelectedYear} garden grid?\n\nThis will remove all plants from this season and cannot be undone.`);
            
            if (isSure) {
                masterGardenDatabase[currentSelectedYear] = {};
                localStorage.setItem('plotAndPlantMasterDb', JSON.stringify(masterGardenDatabase));
                renderGrid();
            }
        }

        function loadYearLedgerData() {
            const data = notesLedgerDatabase[currentSelectedYear];
            if (data) {
                topsoilQtyInput.value = data.topsoilQty || '';
                topsoilCostInput.value = data.topsoilCost || '';
                topdressDateInput.value = data.topdressDate || '';
                fertCostInput.value = data.fertCost || '';
                seedCostInput.value = data.seedCost || '';
                seedlingCostInput.value = data.seedlingCost || '';
                fertTypeInput.value = data.fertType || '';
            } else {
                topsoilQtyInput.value = '';
                topsoilCostInput.value = '';
                topdressDateInput.value = '';
                fertCostInput.value = '';
                seedCostInput.value = '';
                seedlingCostInput.value = '';
                fertTypeInput.value = '';
            }
            calculateSeasonalTotal();
        }

        function saveYearLedgerData() {
            ensureYearExistsInDb(currentSelectedYear);
            notesLedgerDatabase[currentSelectedYear] = {
                topsoilQty: topsoilQtyInput.value,
                topsoilCost: topsoilCostInput.value,
                topdressDate: topdressDateInput.value,
                fertCost: fertCostInput.value,
                seedCost: seedCostInput.value,
                seedlingCost: seedlingCostInput.value,
                fertType: fertTypeInput.value
            };
            localStorage.setItem('plotAndPlantLedgerDb', JSON.stringify(notesLedgerDatabase));
            calculateSeasonalTotal();
        }

        function calculateSeasonalTotal() {
            const soil = parseFloat(topsoilCostInput.value) || 0;
            const fert = parseFloat(fertCostInput.value) || 0;
            const seeds = parseFloat(seedCostInput.value) || 0;
            const seedlings = parseFloat(seedlingCostInput.value) || 0;
            const sum = soil + fert + seeds + seedlings;
            totalCostSpan.innerText = `$${sum.toFixed(2)}`;
        }

        function triggerPhotoUpload() {
            document.getElementById('hiddenFilePicker').click();
        }

        function handleIncomingPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const maxDim = 300;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxDim) { height *= maxDim / width; width = maxDim; }
                    } else {
                        if (height > maxDim) { width *= maxDim / height; height = maxDim; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    const captionText = prompt("Enter a brief tag note for this photo:") || "Progress Update";
                    
                    const today = new Date();
                    const formattedDate = today.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

                    ensureYearExistsInDb(currentSelectedYear);
                    
                    photoJournalDatabase[currentSelectedYear].unshift({
                        id: Date.now(),
                        dateString: formattedDate,
                        image: compressedBase64,
                        caption: captionText
                    });

                    localStorage.setItem('plotAndPlantPhotoDb', JSON.stringify(photoJournalDatabase));
                    renderPhotos();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function renderPhotos() {
            galleryContainer.innerHTML = '';
            const currentYearPhotos = photoJournalDatabase[currentSelectedYear] || [];

            if (currentYearPhotos.length === 0) {
                galleryContainer.innerHTML = `<div style="text-align:center; color:#999; font-size:13px; padding:20px 0;">No photos logged for the ${currentSelectedYear} season yet.</div>`;
                return;
            }

            currentYearPhotos.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <img class="photo-thumb" src="${photo.image}" alt="Garden photo">
                    <div class="photo-details">
                        <div class="photo-date">${photo.dateString}</div>
                        <div class="photo-caption">${photo.caption}</div>
                    </div>
                    <button class="delete-photo-btn" onclick="deletePhoto(${photo.id})">×</button>
                `;
                galleryContainer.appendChild(card);
            });
        }

        function deletePhoto(id) {
            if (!confirm("Delete this photo log?")) return;
            photoJournalDatabase[currentSelectedYear] = photoJournalDatabase[currentSelectedYear].filter(p => p.id !== id);
            localStorage.setItem('plotAndPlantPhotoDb', JSON.stringify(photoJournalDatabase));
            renderPhotos();
        }

        window.onload = initApp;
    </script>
</body>
</html>
